# Service fragment for the crop-ml sidecar. The orchestrator merges this
# into the platform compose file; it is intentionally standalone.
# Merge example:
#   docker compose -f infra/docker-compose.yml -f services/crop-ml/compose.crop-ml.yml up -d crop-ml
services:
  crop-ml:
    build:
      context: ./services/crop-ml
    image: agricplatform/crop-ml:local
    restart: unless-stopped
    environment:
      IMAGERY_PROVIDER: ${IMAGERY_PROVIDER:-stub}
      SENTINEL_STATS_URL: ${SENTINEL_STATS_URL:-}
      SENTINEL_STATS_TOKEN: ${SENTINEL_STATS_TOKEN:-}
      SENTINEL_STATS_TIMEOUT_SECONDS: ${SENTINEL_STATS_TIMEOUT_SECONDS:-5}
      SENTINEL_STATS_RETRIES: ${SENTINEL_STATS_RETRIES:-2}
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
