[package]
name = "geo-compute"
version = "0.1.0"
edition = "2021"
publish = false
description = "Geospatial batch-compute sidecar for AgricPlatform (H3 indexing/compaction, polygon metrics, geofence batch checks)"

[dependencies]
# Minimal dependency set (deliberate: compile time + sandbox wipe risk).
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# h3o: pure-Rust H3 implementation. The `geo` feature (non-default) is
# required for the polygon-to-cells tiler (`h3o::geom::TilerBuilder`), whose
# public API takes `geo::Polygon`.
h3o = { version = "0.9", features = ["geo"] }
# geo is pulled in by h3o itself (default-features = false), so declaring it
# here with the same settings adds zero extra crates to the tree and
# guarantees the exact same `Polygon`/`LineString` types h3o expects.
geo = { version = "0.33", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower-http = { version = "0.7.1", features = ["trace"] }
opentelemetry = "0.32.0"
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
tracing-opentelemetry = "0.33.0"
# OTLP/HTTP exporter. The blocking reqwest client is deliberate: the SDK's
# batch span processor exports from its own dedicated thread (no Tokio
# reactor), which the async reqwest/hyper clients would panic on.
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }

[profile.release]
lto = "thin"
codegen-units = 1
