# AgricPlatform local stack.
# Usage:
#   docker compose -f infra/docker-compose.yml up -d postgres redis keycloak meilisearch
#   docker compose -f infra/docker-compose.yml --profile integrations up -d   # adds Moodle, Discourse, Directus
#   docker compose -f infra/docker-compose.yml --profile apps up -d           # builds and runs web + api
#   docker compose -f infra/docker-compose.yml --profile apps --profile dapr up -d   # + Dapr sidecars
#   docker compose -f infra/docker-compose.yml --profile fluvio up -d         # Fluvio streaming cluster
#   docker compose -f infra/docker-compose.yml --profile mojaloop up -d       # Mojaloop Testing Toolkit (hub emulator)
#   docker compose -f infra/docker-compose.yml --profile geolibre up -d --build  # GeoLibre web GIS on :8300
# All credentials below are LOCAL-ONLY development defaults. Never reuse them outside local dev.

services:
  postgres:
    image: postgres:18-alpine
    container_name: agric-postgres
    environment:
      POSTGRES_USER: agric
      POSTGRES_PASSWORD: agric
      POSTGRES_DB: agric_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Bootstrap schemas/tables on first container init only.
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agric -d agric_platform"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [agric]

  redis:
    image: redis:7-alpine
    container_name: agric-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [agric]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: agric-keycloak
    command:
      - start-dev
      - --import-realm
      - --hostname-strict=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      # Imports every realm file in ./keycloak: realm-export.json (legacy dev
      # realm `agric-platform`) plus realm-agricplatform.json (wave FABRIC
      # canonical realm `agricplatform` with lender/enumerator roles and a
      # confidential agric-api client). See docs/integration-fabric.md.
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/ready | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [agric]

  meilisearch:
    image: getmeili/meilisearch:v1.51
    container_name: agric-meilisearch
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: local-master-key
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7700/health | grep -q available"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [agric]

  api:
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    container_name: agric-api
    environment:
      NODE_ENV: production
      PORT: "3001"
      WEB_URL: http://localhost:3000
      DATABASE_URL: postgresql://agric:agric@postgres:5432/agric_platform
      REDIS_URL: redis://redis:6379
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: agric-platform
      KEYCLOAK_CLIENT_ID: agric-api
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: local-master-key
      JWT_SECRET: local-development-only
      WEBHOOK_SIGNING_SECRET: local-development-only
      SMS_DRIVER: stub
      WHATSAPP_DRIVER: stub
      EMAIL_DRIVER: stub
      PUSH_DRIVER: stub
      PAYMENT_DRIVER: stub
      SEARCH_DRIVER: stub
      WEATHER_DRIVER: stub
      LMS_DRIVER: stub
      COMMUNITY_DRIVER: stub
      # Lakehouse export (marts -> parquet on MinIO). Uncomment together with
      # the "lakehouse" profile to enable POST /api/v1/analytics/export.
      # LAKEHOUSE_ENABLED: "true"
      # LAKEHOUSE_BUCKET: agric-lakehouse
      # LAKEHOUSE_S3_ENDPOINT: http://minio:9000
      # LAKEHOUSE_S3_REGION: us-east-1
      # LAKEHOUSE_S3_ACCESS_KEY: lakehouse
      # LAKEHOUSE_S3_SECRET_KEY: local-lakehouse-secret
      # Flood-risk ML sidecar (OPTIONAL). Uncomment together with the
      # "flood-ml" profile; requires Sentinel Hub credentials on flood-ml.
      # FLOOD_ML_DRIVER: http
      # FLOOD_ML_URL: http://flood-ml:8001
      # Dapr sidecar (OPTIONAL, profile: dapr). The api-dapr container joins
      # this service's network namespace, so the API reaches Dapr on
      # localhost. No Dapr SDK is wired into the API yet — the sidecar is
      # additive (pub/sub + state via HTTP) and fails nothing when absent.
      # DAPR_HTTP_ENDPOINT: http://localhost:3500
      # DAPR_GRPC_ENDPOINT: localhost:50001
      # Mojaloop (OPTIONAL, profile: mojaloop). Dev default targets the
      # Testing Toolkit as a hub-emulator counterparty (MOJALOOP_DRIVER=
      # simulator). The four MOJALOOP_* endpoint vars below are the contract
      # for the live adapter (MOJALOOP_DRIVER=live, another wave); for the
      # full switch deployed via Helm see infra/k8s/mojaloop/README.md and
      # infra/mojaloop/README.md.
      # MOJALOOP_DRIVER: simulator
      # MOJALOOP_SIM_URL: http://mojaloop-ttk:4040
      # MOJALOOP_ALS_ENDPOINT: http://mojaloop-als:4002
      # MOJALOOP_QUOTING_ENDPOINT: http://mojaloop-quoting:4002
      # MOJALOOP_TRANSFERS_ENDPOINT: http://mojaloop-ml-api-adapter:4002
      # MOJALOOP_DFSP_ID: agricdfsp
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      meilisearch:
        condition: service_started
    networks: [agric]

  web:
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
        NEXT_PUBLIC_KEYCLOAK_REALM: agric-platform
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: agric-web
    container_name: agric-web
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks: [agric]

  # ---- Optional integration references (profile: integrations) ----
  # These run the real open-source systems so adapters can be tested against
  # live APIs. They are NOT required for the core platform to boot.

  moodle:
    profiles: ["integrations"]
    image: moodlehq/moodle-php-apache:8.3
    container_name: agric-moodle
    environment:
      MOODLE_DB_TYPE: pgsql
      MOODLE_DB_HOST: moodle-db
      MOODLE_DB_NAME: moodle
      MOODLE_DB_USER: moodle
      MOODLE_DB_PASSWORD: moodle
    ports:
      - "8081:80"
    depends_on:
      - moodle-db
    networks: [agric]

  moodle-db:
    profiles: ["integrations"]
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: moodle
      POSTGRES_DB: moodle
    volumes:
      - moodle-db-data:/var/lib/postgresql/data
    networks: [agric]

  discourse:
    profiles: ["integrations"]
    image: bitnami/discourse:3
    container_name: agric-discourse
    environment:
      DISCOURSE_HOST: localhost
      DISCOURSE_PORT_NUMBER: "8082"
      DISCOURSE_DATABASE_HOST: discourse-db
      DISCOURSE_DATABASE_NAME: discourse
      DISCOURSE_DATABASE_USER: discourse
      DISCOURSE_DATABASE_PASSWORD: discourse
      DISCOURSE_REDIS_HOST: redis
    ports:
      - "8082:3000"
    depends_on:
      - discourse-db
      - redis
    networks: [agric]

  discourse-db:
    profiles: ["integrations"]
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: discourse
      POSTGRES_PASSWORD: discourse
      POSTGRES_DB: discourse
    volumes:
      - discourse-db-data:/var/lib/postgresql/data
    networks: [agric]

  directus:
    profiles: ["integrations"]
    image: directus/directus:12
    container_name: agric-directus
    environment:
      KEY: local-directus-key
      SECRET: local-directus-secret
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: agric_platform
      DB_USER: agric
      DB_PASSWORD: agric
      ADMIN_EMAIL: admin@example.local
      ADMIN_PASSWORD: local-admin-password
    ports:
      - "8055:8055"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [agric]

  # ---- Lakehouse export target (profile: lakehouse) ----
  # MinIO is the local S3-compatible object store the analytics lakehouse
  # exporter (POST /api/v1/analytics/export) writes parquet part-files to.
  # This is dev-only infrastructure — it is object storage plus a manifest
  # contract, NOT a managed lakehouse. To use it:
  #   docker compose -f infra/docker-compose.yml --profile lakehouse up -d
  # then run the API with LAKEHOUSE_ENABLED=true LAKEHOUSE_BUCKET=agric-lakehouse
  # LAKEHOUSE_S3_ENDPOINT=http://localhost:9000 LAKEHOUSE_S3_ACCESS_KEY=lakehouse
  # LAKEHOUSE_S3_SECRET_KEY=local-lakehouse-secret (LOCAL-ONLY defaults below).

  minio:
    profiles: ["lakehouse", "lakehouse-query", "sedona"]
    image: minio/minio:latest
    container_name: agric-minio
    command: server /data --console-address ":9001"
    environment:
      # LOCAL-ONLY development credentials. Never reuse outside local dev.
      MINIO_ROOT_USER: lakehouse
      MINIO_ROOT_PASSWORD: local-lakehouse-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -f http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [agric]

  minio-bootstrap:
    profiles: ["lakehouse", "lakehouse-query", "sedona"]
    image: minio/mc:latest
    container_name: agric-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 lakehouse local-lakehouse-secret;
        mc mb --ignore-existing local/agric-lakehouse;
        echo "bucket agric-lakehouse ready";
    networks: [agric]

  # ---- OPTIONAL query convenience (profile: lakehouse-query) ----
  # Trino over the MinIO parquet prefix, for local ad-hoc SQL only. There is
  # NO table-format catalog: the hive connector below uses a local file
  # metastore and each mart table must be registered by hand (CREATE TABLE
  # ... WITH (external_location = 's3a://agric-lakehouse/lakehouse/<table>/',
  # format = 'PARQUET', partitioned_by = dt)) — see docs/analytics-lakehouse.md
  # for the exact DDL. Not started by default; not a managed lakehouse.
  trino:
    profiles: ["lakehouse-query"]
    image: trinodb/trino:latest
    container_name: agric-trino
    ports:
      - "8086:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - trino-metastore:/var/trino/metastore
    depends_on:
      - minio
      - minio-bootstrap
    networks: [agric]

  # ---- OPTIONAL flood-detection ML sidecar (profile: flood-ml) ----
  # IBM Granite geospatial flood detection (services/flood-ml), ported from
  # farmer-data-collection ml-service. NOT required for the platform to run;
  # the API only calls it when FLOOD_ML_DRIVER=http and FLOOD_ML_URL are set
  # on the api service (stub driver remains the default). Real inference
  # requires Sentinel Hub credentials — create an OAuth client at
  # https://www.sentinel-hub.com/ and pass BOTH variables below.
  #   docker compose -f infra/docker-compose.yml --profile flood-ml up -d flood-ml
  flood-ml:
    profiles: ["flood-ml"]
    build:
      context: ../services/flood-ml
    container_name: agric-flood-ml
    environment:
      # REQUIRED for real inference (without them /predict answers 503).
      SENTINEL_HUB_CLIENT_ID: ${SENTINEL_HUB_CLIENT_ID:-}
      SENTINEL_HUB_CLIENT_SECRET: ${SENTINEL_HUB_CLIENT_SECRET:-}
      SENTINEL_HUB_INSTANCE_ID: ${SENTINEL_HUB_INSTANCE_ID:-}
      # Optional result cache (reuses the stack Redis; runs fine without).
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "8001:8001"
    networks: [agric]

  # ---- OPTIONAL polyglot sidecars (Stage 18, profiles: event-gw / crop-ml /
  # geo-compute) — none start by default; the platform boots without them.
  # Each pairs with a fail-closed provider port in the API (stub drivers by
  # default). Contracts: services/<name>/README.md. ----

  # Go stdlib-only webhook edge: verifies external provider webhooks
  # (fail-closed) and fans out to the API internal event ingress with
  # retries, circuit breaker and a disk dead-letter spool.
  event-gw:
    profiles: ["event-gw"]
    build:
      context: ../services/event-gw
    container_name: agric-event-gw
    environment:
      # stub (default, dev only) or live (verifies HMAC per provider).
      EVENTGW_MODE: ${EVENTGW_MODE:-stub}
      EVENTGW_PROVIDERS: ${EVENTGW_PROVIDERS:-weather,payments,imagery}
      # REQUIRED per provider in live mode, else that route answers 503:
      EVENTGW_SECRET_WEATHER: ${EVENTGW_SECRET_WEATHER:-}
      EVENTGW_SECRET_PAYMENTS: ${EVENTGW_SECRET_PAYMENTS:-}
      EVENTGW_SECRET_IMAGERY: ${EVENTGW_SECRET_IMAGERY:-}
      EVENTGW_API_INGRESS_URL: ${EVENTGW_API_INGRESS_URL:-http://api:3001/api/v1/internal/events}
      EVENTGW_INTERNAL_TOKEN: ${EVENTGW_INTERNAL_TOKEN:-}
      EVENTGW_SPOOL_PATH: /var/spool/event-gw/deadletter.jsonl
    ports:
      - "8090:8090"
    volumes:
      - event-gw-spool:/var/spool/event-gw
    healthcheck:
      # distroless has no shell/wget; the binary self-probes /healthz.
      test: ["CMD", "/event-gw", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks: [agric]

  # Python FastAPI crop-intelligence sidecar: NDVI/phenology/health-score
  # per plot+season. STUB imagery provider by default (deterministic,
  # labelled); live provider fails closed without config.
  crop-ml:
    profiles: ["crop-ml"]
    build:
      context: ../services/crop-ml
    container_name: agric-crop-ml
    image: agricplatform/crop-ml:local
    restart: unless-stopped
    environment:
      IMAGERY_PROVIDER: ${IMAGERY_PROVIDER:-stub}
      SENTINEL_STATS_URL: ${SENTINEL_STATS_URL:-}
      SENTINEL_STATS_TOKEN: ${SENTINEL_STATS_TOKEN:-}
      SENTINEL_STATS_TIMEOUT_SECONDS: ${SENTINEL_STATS_TIMEOUT_SECONDS:-5}
      SENTINEL_STATS_RETRIES: ${SENTINEL_STATS_RETRIES:-2}
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [agric]

  # Rust axum geospatial batch-compute sidecar: H3 index/compact, polygon
  # metrics, geofence batch. stub/live modes; contract in README.
  geo-compute:
    profiles: ["geo-compute"]
    build:
      context: ../services/geo-compute
    container_name: agric-geo-compute
    image: agricplatform/geo-compute:local
    restart: unless-stopped
    environment:
      GEOCOMPUTE_MODE: ${GEOCOMPUTE_MODE:-stub}
      GEOCOMPUTE_PORT: 8200
      GEOCOMPUTE_MAX_CELLS: ${GEOCOMPUTE_MAX_CELLS:-100000}
      GEOCOMPUTE_MAX_POINTS: ${GEOCOMPUTE_MAX_POINTS:-100000}
      GEOCOMPUTE_MAX_COMPACT_INPUT: ${GEOCOMPUTE_MAX_COMPACT_INPUT:-1000000}
    ports:
      - "8200:8200"
    networks: [agric]

  # ==========================================================================
  # Wave FABRIC optional middleware profiles — NONE start by default. Each
  # pairs with a fail-closed API driver (docs/integration-fabric.md); the API
  # keeps its stub drivers until the matching *_DRIVER env is set. All
  # credentials are LOCAL-ONLY development defaults. Several tags are moving
  # targets ('latest') where upstream offers no stable alias — pin versions
  # before any non-local use. Compose file validity is verified in CI; the
  # services themselves have NOT been run as part of this wave.
  # ==========================================================================

  # ---- Event bus (profile: redpanda) ----
  # Kafka-compatible single-binary broker. API wiring:
  #   EVENT_BUS_DRIVER=kafka KAFKA_BROKERS=redpanda:9092
  redpanda:
    profiles: ["redpanda"]
    image: redpandadata/redpanda:latest
    container_name: agric-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks: [agric]

  # ---- Workflow orchestration (profile: temporal) ----
  # Temporal server (auto-setup, own postgres) + web UI. API wiring:
  #   WORKFLOW_DRIVER=temporal TEMPORAL_ADDRESS=temporal:7233
  # Worker (not auto-started): TEMPORAL_ADDRESS=localhost:7233 \
  #   npm run worker:temporal -w @agric-platform/api
  temporal-db:
    profiles: ["temporal"]
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    networks: [agric]

  temporal:
    profiles: ["temporal"]
    image: temporalio/auto-setup:latest
    container_name: agric-temporal
    depends_on:
      - temporal-db
    environment:
      DB: postgresql
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-db
    ports:
      - "7233:7233"
    networks: [agric]

  temporal-ui:
    profiles: ["temporal"]
    image: temporalio/ui:latest
    container_name: agric-temporal-ui
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8088:8080"
    networks: [agric]

  # ---- Relationship-based authorization (profile: permify) ----
  # In-memory storage (dev only — schema/tuples lost on restart). API wiring:
  #   AUTHORIZATION_DRIVER=permify PERMIFY_URL=http://permify:3476
  # Schema + relationship tuples are provisioned out-of-band — see
  # docs/integration-fabric.md for the credit_loan schema snippet.
  permify:
    profiles: ["permify"]
    image: ghcr.io/permify/permify:latest
    container_name: agric-permify
    command: ["serve", "--database-engine=memory"]
    ports:
      - "3476:3476" # REST
      - "3478:3478" # gRPC
    networks: [agric]

  # ---- Search engine (profile: opensearch) ----
  # Single node WITH the security plugin demo config enabled (self-signed
  # demo certs, TLS + basic auth required). API wiring:
  #   SEARCH_DRIVER=opensearch OPENSEARCH_NODE=https://opensearch:9200
  #   OPENSEARCH_USERNAME=admin OPENSEARCH_PASSWORD=<OPENSEARCH_ADMIN_PASSWORD>
  #   OPENSEARCH_TLS_REJECT_UNAUTHORIZED=false   (demo certs only!)
  opensearch:
    profiles: ["opensearch"]
    image: opensearchproject/opensearch:2
    container_name: agric-opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "false"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:-LocalDevOnly-ChangeMe1}
      OPENSEARCH_JAVA_OPTS: -Xms256m -Xmx256m
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks: [agric]

  # ---- Append-only ledger backend (profile: tigerbeetle) ----
  # Single-replica dev cluster on a data volume. LEGAL GATE: the API driver
  # defaults OFF (Postgres ledger stays the system of record). API wiring:
  #   LEDGER_DRIVER=tigerbeetle TIGERBEETLE_ADDRESSES=tigerbeetle:3000
  #   TIGERBEETLE_CLUSTER_ID=0
  # NOTE: re-running `up` after the data file exists makes tigerbeetle-init
  # fail its format step (by design — format is one-shot); remove the init
  # container (`docker compose ... rm -s tigerbeetle-init`) on subsequent runs.
  tigerbeetle-init:
    profiles: ["tigerbeetle"]
    image: ghcr.io/tigerbeetle/tigerbeetle:latest
    container_name: agric-tigerbeetle-init
    command: format --cluster=0 --replica=0 --replica-count=1 --development /data/0_0.tigerbeetle
    volumes:
      - tigerbeetle-data:/data
    networks: [agric]

  tigerbeetle:
    profiles: ["tigerbeetle"]
    image: ghcr.io/tigerbeetle/tigerbeetle:latest
    container_name: agric-tigerbeetle
    command: start --addresses=0.0.0.0:3000 --development /data/0_0.tigerbeetle
    depends_on:
      tigerbeetle-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    volumes:
      - tigerbeetle-data:/data
    networks: [agric]

  # ---- API gateway (profile: apisix) ----
  # APISIX in standalone data-plane mode: declarative routes from
  # infra/apisix/apisix.yaml (key-auth placeholder + limit-count mirroring
  # the app throttler). etcd is provisioned alongside for teams that want
  # the traditional admin-API mode instead — the default profile does NOT
  # use it. Gateway listens on :9080 (routes api:3001 / web:3000).
  apisix-etcd:
    profiles: ["apisix"]
    image: bitnami/etcd:3.5
    environment:
      ETCD_ENABLE_V2: "true"
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: http://apisix-etcd:2379
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
    volumes:
      - apisix-etcd-data:/bitnami/etcd
    networks: [agric]

  apisix:
    profiles: ["apisix"]
    image: apache/apisix:latest
    container_name: agric-apisix
    depends_on:
      - apisix-etcd
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "9080:9080"
    networks: [agric]

  # ---- WAF / API security agent (profile: openappsec) ----
  # open-appsec nano-agent + nginx attachment in front of web/api (edge
  # listens on :8090, proxies to api:3001 and web:3000 via
  # infra/openappsec/nginx-proxy.conf). Policy management needs EITHER a
  # SaaS profile token (APPSEC_AGENT_TOKEN) or a local policy file under
  # infra/openappsec/localconf — see docs/integration-fabric.md. Never
  # verified against live traffic in this wave.
  openappsec-agent:
    profiles: ["openappsec"]
    image: ghcr.io/openappsec/agent:latest
    container_name: agric-appsec-agent
    ipc: host
    environment:
      registered_server: NGINX
      autoPolicyLoad: "true"
      AGENT_TOKEN: ${APPSEC_AGENT_TOKEN:-}
    volumes:
      - appsec-conf:/etc/cp/conf
      - appsec-data:/etc/cp/data
      - appsec-logs:/var/log/nano_agent
      - ./openappsec/localconf:/ext/appsec
      - appsec-shm:/dev/shm/check-point
    command: /cp-nano-agent
    networks: [agric]

  openappsec-nginx:
    profiles: ["openappsec"]
    image: ghcr.io/openappsec/nginx-attachment:latest
    container_name: agric-appsec-nginx
    ipc: host
    depends_on:
      - openappsec-agent
    volumes:
      - ./openappsec/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - appsec-shm:/dev/shm/check-point
    ports:
      - "8090:80"
    networks: [agric]

  # ---- Batch geo analytics (profile: sedona) ----
  # Apache Sedona one-shot Spark job over the MinIO lakehouse parquet.
  # BATCH ONLY — not wired into any request path (infra/sedona/README.md).
  # Requires a prior lakehouse export (--profile lakehouse + POST
  # /api/v1/analytics/export). minio/minio-bootstrap also carry the sedona
  # profile so `--profile sedona up -d` starts the object store too.
  sedona:
    profiles: ["sedona"]
    image: apache/sedona:latest
    container_name: agric-sedona
    depends_on:
      - minio
    volumes:
      - ./sedona/batch-geo.py:/opt/job/batch-geo.py:ro
    entrypoint: /opt/spark/bin/spark-submit
    command:
      - --master
      - local[2]
      - --packages
      - org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262
      - /opt/job/batch-geo.py
    environment:
      S3A_ENDPOINT: http://minio:9000
      S3A_ACCESS_KEY: lakehouse
      S3A_SECRET_KEY: local-lakehouse-secret
    networks: [agric]

  # ==========================================================================
  # Wave stage25 optional platform components — NONE start by default. All
  # images are pinned (no 'latest'); all credentials are LOCAL-ONLY.
  # ==========================================================================

  # ---- Dapr (profile: dapr) ----
  # Dapr placement service + daprd sidecars for agric-api and agric-event-gw.
  # The sidecars join the app container's network namespace (network_mode:
  # service:...) so app<->sidecar traffic stays on localhost, matching Dapr
  # semantics. Components live in infra/dapr/components/ (pub/sub -> redpanda,
  # state store -> redis); runtime config (OTel tracing to otel-collector:4317,
  # Prometheus metrics on :9090) in infra/dapr/config.yaml.
  # Requires: --profile apps --profile dapr (api-dapr attaches to api) and/or
  # --profile event-gw --profile dapr (event-gw-dapr attaches to event-gw).
  # NOTE on healthchecks: daprio/* images are distroless (no shell, no wget/
  # nc), so the checks below are exec-liveness only. Real readiness is
  # GET :3501/v1.0/healthz on each sidecar — probe that from the
  # observability layer instead.
  dapr-placement:
    profiles: ["dapr"]
    image: daprio/placement:1.18.3
    container_name: agric-dapr-placement
    ports:
      - "50005:50005"
    healthcheck:
      test: ["CMD", "/placement", "--version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks: [agric]

  api-dapr:
    profiles: ["dapr"]
    image: daprio/daprd:1.18.3
    container_name: agric-api-dapr
    command:
      - /daprd
      - --app-id=agric-api
      - --app-port=3001
      - --app-protocol=http
      - --placement-host-address=dapr-placement:50005
      - --components-path=/components
      - --config=/config/config.yaml
      - --log-level=info
    volumes:
      - ./dapr/components:/components:ro
      - ./dapr/config.yaml:/config/config.yaml:ro
    depends_on:
      - api
      - dapr-placement
    healthcheck:
      test: ["CMD", "/daprd", "--version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    # Shares the api container's network namespace: Dapr HTTP :3500, gRPC
    # :50001, health :3501 and metrics :9090 are reachable as localhost:*
    # from api, and as agric-api:* from other compose services.
    network_mode: "service:api"

  event-gw-dapr:
    profiles: ["dapr"]
    image: daprio/daprd:1.18.3
    container_name: agric-event-gw-dapr
    command:
      - /daprd
      - --app-id=agric-event-gw
      - --app-port=8090
      - --app-protocol=http
      - --placement-host-address=dapr-placement:50005
      - --components-path=/components
      - --config=/config/config.yaml
      - --log-level=info
    volumes:
      - ./dapr/components:/components:ro
      - ./dapr/config.yaml:/config/config.yaml:ro
    depends_on:
      - event-gw
      - dapr-placement
    healthcheck:
      test: ["CMD", "/daprd", "--version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    network_mode: "service:event-gw"

  # ---- Fluvio streaming (profile: fluvio) ----
  # Single-SCU dev cluster following the official docker-compose example
  # (fluvio repo examples/docker-compose), pinned to the v0.18.1 platform
  # release instead of the moving ':stable' tag. No API driver consumes
  # Fluvio yet — this is standalone infrastructure for streaming workloads.
  # Layout: SC public API :9003 (clients), SC internal :9004 (SPU link),
  # SPU public :9010 (produce/consume), SPU private :9011 (SC->SPU).
  fluvio-sc:
    profiles: ["fluvio"]
    image: infinyon/fluvio:v0.18.1
    container_name: agric-fluvio-sc
    hostname: fluvio-sc
    command: ["./fluvio-run", "sc", "--local", "/fluvio/metadata"]
    environment:
      RUST_LOG: info
    ports:
      - "9003:9003"
    volumes:
      - fluvio-metadata:/fluvio/metadata
    healthcheck:
      # infinyon/fluvio is alpine-based: busybox nc is available.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9003"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks: [agric]

  fluvio-sc-setup:
    profiles: ["fluvio"]
    image: alpine:3.21
    container_name: agric-fluvio-sc-setup
    # One-shot job (no healthcheck — exits 0 on success, like
    # tigerbeetle-init): downloads the PINNED v0.18.1 CLI (sha256-verified
    # against the GitHub release asset digest) and registers the SPU.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        wget -q -O /tmp/fluvio.zip https://github.com/fluvio-community/fluvio/releases/download/v0.18.1/fluvio-x86_64-unknown-linux-musl.zip
        echo "1b2e016749b6c5a5e7805505e34a8f26d36f3f01112e5cf8d5e39eddbdaa2be  /tmp/fluvio.zip" | sha256sum -c -
        unzip -o /tmp/fluvio.zip -d /tmp
        chmod +x /tmp/fluvio
        /tmp/fluvio profile add docker fluvio-sc:9003 docker
        /tmp/fluvio cluster spu register --id 5001 -p localhost:9010 --private-server fluvio-spu:9011
        /tmp/fluvio topic create agric-events --if-not-exists 2>/dev/null || /tmp/fluvio topic create agric-events || true
        echo "fluvio cluster ready (SC fluvio-sc:9003, SPU 5001 registered)"
    depends_on:
      fluvio-sc:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    networks: [agric]

  fluvio-spu:
    profiles: ["fluvio"]
    image: infinyon/fluvio:v0.18.1
    container_name: agric-fluvio-spu
    hostname: fluvio-spu
    command:
      - ./fluvio-run
      - spu
      - -i
      - "5001"
      - -p
      - fluvio-spu:9010
      - -v
      - fluvio-spu:9011
      - --sc-addr
      - fluvio-sc:9004
      - --log-base-dir
      - /fluvio/data
    environment:
      RUST_LOG: info
    ports:
      - "9010:9010" # SPU public (produce/consume, redirected from SC)
      - "9011:9011" # SPU private (SC control plane)
    volumes:
      - fluvio-data:/fluvio/data
    depends_on:
      fluvio-sc:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9011"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks: [agric]

  # ---- Mojaloop testing toolkit (profile: mojaloop) ----
  # INTEGRATION-GRADE DEV PATH: the full Mojaloop switch (ALS, quoting,
  # transaction-requests, ml-api-adapter, central-ledger + MySQL/Kafka) is
  # deployed via the official Helm chart — see infra/k8s/mojaloop/ and
  # infra/mojaloop/README.md for why compose is NOT used for the switch.
  # What runs here is the official Testing Toolkit pair, which emulates the
  # hub side of the FSPIOP contract for our adapter (MOJALOOP_DRIVER=
  # simulator, MOJALOOP_SIM_URL=http://mojaloop-ttk:4040 on the api service)
  # and serves as the simulator counterparty for TTK test collections.
  mojaloop-ttk:
    profiles: ["mojaloop"]
    image: mojaloop/ml-testing-toolkit:v18.19.1
    container_name: agric-mojaloop-ttk
    ports:
      - "4040:4040" # FSPIOP API surface (adapter target)
      - "5050:5050" # admin/report API consumed by the UI
    healthcheck:
      # node-alpine image: no curl/wget; probe the FSPIOP listener over TCP.
      test:
        - CMD
        - node
        - -e
        - require("net").connect(4040,"127.0.0.1").on("connect",()=>process.exit(0)).on("error",()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks: [agric]

  mojaloop-ttk-ui:
    profiles: ["mojaloop"]
    image: mojaloop/ml-testing-toolkit-ui:v16.7.4
    container_name: agric-mojaloop-ttk-ui
    environment:
      # Browser-side URL (the UI is static; start.sh substitutes these), so
      # it must be host-reachable, not the in-compose service name.
      API_BASE_URL: http://localhost:5050
      AUTH_ENABLED: "false"
    ports:
      - "6060:6060"
    depends_on:
      mojaloop-ttk:
        condition: service_healthy
    healthcheck:
      # nginx:alpine base: busybox wget is available.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:6060/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks: [agric]

  # ---- GeoLibre web GIS (profile: geolibre) ----
  # Builds the upstream GeoLibre web bundle (Tauri/React/MapLibre/DuckDB-WASM)
  # from PINNED tag v2.8.0 (commit verified inside the Dockerfile) and serves
  # it with nginx on :8300. Offline/air-gapped alternative:
  # infra/geolibre/fetch.sh + GEOLIBRE_SOURCE=local. See infra/geolibre/README.md.
  geolibre:
    profiles: ["geolibre"]
    build:
      context: ./geolibre
      dockerfile: Dockerfile
      args:
        GEOLIBRE_SOURCE: ${GEOLIBRE_SOURCE:-remote}
    image: agricplatform/geolibre:2.8.0
    container_name: agric-geolibre
    ports:
      - "8300:8300"
    healthcheck:
      # nginx:alpine base: busybox wget; /healthz is defined in nginx.conf.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8300/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks: [agric]

  # ---- Observability hub (profile: observability) ----
  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.113.0
    container_name: agric-otel-collector
    command: ["--config=/etc/otelcol/otel-collector-config.yaml"]
    environment:
      POSTGRES_USER: agric
      POSTGRES_PASSWORD: agric            # dev placeholder — secret store in prod
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-development}
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol/otel-collector-config.yaml:ro
      - appsec-logs:/var/log/openappsec/nano_agent:ro   # openappsec filelog
    ports:
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
      - "9464:9464"    # prometheus re-export
      - "13133:13133"  # health_check extension
    depends_on:
      - signoz-otel-collector
    restart: unless-stopped
    networks: [agric]

  # ---- SigNoz stack (profile: observability) ----
  signoz-zookeeper:
    profiles: ["observability"]
    image: bitnami/zookeeper:3.7.1
    container_name: agric-signoz-zookeeper
    environment:
      ZOO_SERVER_ID: "1"
      ALLOW_ANONYMOUS_LOGIN: "yes"
      ZOO_AUTOPURGE_INTERVAL: "1"
    volumes: [signoz-zookeeper-data:/bitnami]
    networks: [agric]

  signoz-clickhouse:
    profiles: ["observability"]
    image: clickhouse/clickhouse-server:24.1.2-alpine
    container_name: agric-signoz-clickhouse
    depends_on: [signoz-zookeeper]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes: [signoz-clickhouse-data:/var/lib/clickhouse]
    networks: [agric]

  signoz-otel-collector-migrator:
    profiles: ["observability"]
    image: signoz/signoz-schema-migrator:0.111.13
    container_name: agric-signoz-migrator
    command: ["--dsn=tcp://signoz-clickhouse:9000"]
    depends_on:
      signoz-clickhouse: {condition: service_healthy}
    networks: [agric]

  signoz-otel-collector:
    profiles: ["observability"]
    image: signoz/signoz-otel-collector:0.111.13
    container_name: agric-signoz-otel-collector
    # default image config receives OTLP on 4317/4318 and writes clickhouse
    command: ["--config=/etc/otel-collector-config.yaml", "--feature-gates=-pkg.translator.prometheus.NormalizeName"]
    environment:
      OTEL_RESOURCE_ATTRIBUTES: host.name=agric-signoz,os.type=linux
      LOW_CARDINAL_EXCEPTION_GROUPING: "false"
    depends_on:
      signoz-clickhouse: {condition: service_healthy}
      signoz-otel-collector-migrator: {condition: service_completed_successfully}
    restart: on-failure
    networks: [agric]

  signoz-query-service:
    profiles: ["observability"]
    image: signoz/query-service:0.55.0
    container_name: agric-signoz-query-service
    command: ["-config=/root/config/prometheus.yml"]
    volumes:
      - signoz-data:/var/lib/signoz
    environment:
      ClickHouseUrl: tcp://signoz-clickhouse:9000/?database=signoz_traces
      ALERTMANAGER_API_PREFIX: http://signoz-alertmanager:9093/api/
      SIGNOZ_LOCAL_DB_PATH: /var/lib/signoz/signoz.db
      STORAGE: clickhouse
      GODEBUG: netdns=go
      TELEMETRY_ENABLED: "true"
      DEPLOYMENT_TYPE: docker-standalone
      # SMTP for email notification channels (dev placeholders):
      SMTP_ENABLED: "false"
      # SMTP_HOST: smtp.example.com
      # SMTP_PORT: "587"
      # SMTP_FROM: signoz@agric-platform.example.com
      # SMTP_AUTH_USERNAME: REPLACE_WITH_SMTP_USERNAME
      # SMTP_AUTH_PASSWORD: REPLACE_WITH_SMTP_PASSWORD
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      signoz-clickhouse: {condition: service_healthy}
      signoz-otel-collector-migrator: {condition: service_completed_successfully}
    restart: on-failure
    networks: [agric]

  signoz-alertmanager:
    profiles: ["observability"]
    image: signoz/alertmanager:0.23.5
    container_name: agric-signoz-alertmanager
    command:
      - --queryService.url=http://signoz-query-service:8085
      - --storage.path=/data
    volumes: [signoz-alertmanager-data:/data]
    depends_on:
      signoz-query-service: {condition: service_healthy}
    restart: on-failure
    networks: [agric]

  signoz-frontend:
    profiles: ["observability"]
    image: signoz/frontend:0.55.0
    container_name: agric-signoz-frontend
    ports: ["3301:3301"]
    depends_on:
      - signoz-alertmanager
      - signoz-query-service
    restart: on-failure
    networks: [agric]

volumes:
  signoz-zookeeper-data:
  signoz-clickhouse-data:
  signoz-data:
  signoz-alertmanager-data:
  postgres-data:
  event-gw-spool:
  redis-data:
  meili-data:
  moodle-db-data:
  discourse-db-data:
  minio-data:
  trino-metastore:
  redpanda-data:
  temporal-db-data:
  opensearch-data:
  tigerbeetle-data:
  apisix-etcd-data:
  fluvio-metadata:
  fluvio-data:
  appsec-conf:
  appsec-data:
  appsec-logs:
  appsec-shm:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs

networks:
  agric:
    driver: bridge
