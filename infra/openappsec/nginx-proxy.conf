# open-appsec nginx attachment proxy config (wave FABRIC, LOCAL DEV ONLY).
# Loaded by the ghcr.io/openappsec/nginx-attachment container. Terminates
# edge traffic on :8090 and proxies to the api service; the open-appsec
# nano-agent inspects requests via the attachment module (shared memory).
server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
