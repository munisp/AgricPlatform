# Trino catalog over the lakehouse-export parquet prefix on MinIO.
# LOCAL QUERY CONVENIENCE ONLY — this is not a managed lakehouse and there is
# no Iceberg/Delta catalog. Tables are registered manually against the
# exporter's hive-style layout (see docs/analytics-lakehouse.md §3.4):
#   s3://agric-lakehouse/lakehouse/<table>/dt=YYYY-MM-DD/part-*.parquet
#
# The file metastore stores table metadata on the trino-metastore volume, so
# manually created tables survive container restarts but are NOT shared with
# any other engine.
connector.name=hive
hive.metastore=file
hive.metastore.catalog.dir=file:///var/trino/metastore
hive.allow-register-partition-procedure=true

fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=lakehouse
s3.aws-secret-key=local-lakehouse-secret
