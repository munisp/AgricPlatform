# nginx serving the GeoLibre web bundle on :8300.
server {
    listen 8300;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DuckDB-WASM / MapLibre workers need cross-origin isolation
    # (SharedArrayBuffer) — these two headers are required, not optional.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Health endpoint used by the compose healthcheck and k8s probes.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Long-cache fingerprinted Vite assets.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    # OTel story: access logs go to stdout/stderr (nginx default via the
    # official image symlinks). The observability collector picks them up
    # with a container-stdout receiver; if filelog is preferred, point the
    # collector at /var/log/nginx/access.log inside this container.
}
