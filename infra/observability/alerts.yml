# SLO-based alert rules for the AgricPlatform API (Wave OPS).
# Every expr references only series the API actually exports:
#   http_requests_total / http_request_duration_seconds (RED, by route/status)
#   agric_errors_5xx_total, agric_otp_*, agric_idempotent_replays_total
#   agric_outbox_backlog_records{state}, agric_outbox_oldest_pending_age_seconds
#   agric_notifications_queued, agric_notification_dlq_depth
#   agric_escrow_locked_amount_kobo{status}
#   agric_voucher_redemptions_total{result}, agric_agent_payouts_total{result} (V-78)
# Backup freshness references agric_backup_last_success_timestamp_seconds,
# pushed by the backup job (scripts/backup-postgres.sh → pushgateway or
# node-exporter textfile) — see docs/runbooks/dr.md.
# Thresholds are starting recommendations — tune against real traffic before
# tightening paging policies. Runbook: docs/runbooks/ops.md#on-call-alerts.

groups:
  - name: agric-api-availability
    rules:
      - alert: AgricApiDown
        expr: up{job="agric-api"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: API unreachable (or /metrics scrape failing)
          action: >-
            Check pod health (kubectl get pods -n agric-platform), then
            /health/live directly. If pods are up but scrapes fail, verify the
            METRICS_TOKEN credential file and that the metrics route returns
            401/200 (not 404) — see docs/runbooks/ops.md#on-call-alerts.

      - alert: AgricApiHigh5xxRate
        # SLO: < 5% of requests may 5xx over any 10-minute window.
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[10m]))
            / sum(rate(http_requests_total[10m])) > 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: API 5xx ratio above 5% for 10m
          action: >-
            Identify the failing routes (Grafana: HTTP 5xx rate panel),
            check agric_errors_5xx_total and Sentry for the exception, and
            /health/ready for a degraded dependency (postgres/redis).

      - alert: AgricApiHighLatencyP95
        # SLO: p95 request latency < 2s (low-bandwidth PWA budget).
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 2
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: API p95 latency above 2s for 10m
          action: >-
            Break down by route (Grafana: p95 latency panel). Common causes:
            missing DB index on a hot query, N+1 in a listing endpoint,
            Redis down forcing in-memory fallback.

  - name: agric-platform-backlogs
    rules:
      - alert: AgricOutboxBacklogGrowing
        # SLO: event outbox drains continuously; sustained backlog = relay down.
        expr: agric_outbox_backlog_records{state="pending"} > 100
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: Domain-event outbox backlog above 100 for 15m
          action: >-
            The external sweeper may have stopped: check the cron/CronJob that
            runs scripts/sweep-outbox.mjs, then run one manual sweep
            (npm run sweep:outbox) and watch agric_outbox_backlog_records drop.

      - alert: AgricOutboxOldestPendingOld
        # SLO: no outbox row may sit unpublished for over 30 minutes.
        expr: agric_outbox_oldest_pending_age_seconds > 1800
        for: 5m
        labels:
          severity: page
        annotations:
          summary: Oldest unpublished outbox row older than 30m
          action: >-
            A row is stuck (listener throws every sweep). Inspect the API logs
            for "outbox relay failed", fix the listener, then re-sweep. Rows
            dead-letter after 8 attempts — see AgricOutboxDeadLetters.

      - alert: AgricOutboxDeadLetters
        expr: agric_outbox_backlog_records{state="dead_lettered"} > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: Outbox rows dead-lettered (event delivery lost)
          action: >-
            Events exhausted retries — downstream consumers missed them.
            List dead letters via the admin outbox endpoints, fix the failing
            listener, then replay. Verify consumer lag via the analytics
            projector heartbeat on /health/modules (admin).

      - alert: AgricNotificationDlqNonEmpty
        expr: agric_notification_dlq_depth > 0
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: Notification delivery dead letters present
          action: >-
            Messages failed all delivery retries. Check the provider driver
            (termii/whatsapp/mailgun) credentials with npm run verify:providers,
            then requeue or notify affected users per docs/runbooks/ops.md.

      - alert: AgricNotificationQueueStuck
        expr: agric_notifications_queued > 500
        for: 30m
        labels:
          severity: warn
        annotations:
          summary: More than 500 notifications queued for 30m
          action: >-
            Delivery pipeline is not draining. Check provider health
            (npm run verify:providers) and API logs for delivery errors.

  - name: agric-escrow-invariants
    rules:
      - alert: AgricEscrowNegativeBalance
        # Invariant: locked escrow can never be negative — a negative reading
        # means double-release/refund logic corrupted the ledger view.
        expr: agric_escrow_locked_amount_kobo < 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: NEGATIVE locked escrow amount — funds-integrity incident
          action: >-
            Treat as a funds-integrity incident: freeze escrow transitions,
            run the escrow/order reconciliation against the ledger, and page
            the payments on-call per docs/runbooks/ops.md#escrow-invariants.

      - alert: AgricEscrowStuckPendingState
        # Invariant: releasing/refunding are system-driven pending states that
        # must clear in minutes; a non-zero amount for 6h means a provider
        # call is wedged and buyer funds are in limbo.
        expr: |
          min_over_time(agric_escrow_locked_amount_kobo{status=~"releasing|refunding"}[6h]) > 0
        for: 6h
        labels:
          severity: page
        annotations:
          summary: Escrow stuck in releasing/refunding for over 6h
          action: >-
            A provider-backed release/refund crashed mid-call. The records are
            resumable by design: re-drive the transition as admin (guarded
            write happened before the provider call) after verifying the
            provider side with npm run verify:providers.

  - name: agric-auth-abuse
    rules:
      - alert: AgricOtpLockoutStorm
        expr: rate(agric_otp_verifications_total{result="locked"}[15m]) > 0.05
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: OTP lockouts climbing — possible credential stuffing
          action: >-
            Check OTP request sources; consider tightening throttler limits on
            /auth/otp/* per docs/security-compliance.md §7.

      - alert: AgricThrottleRedisFailOpen
        # V-77 degraded tier: any redis error in the throttler storage means
        # rate limiting is running fail-open (requests served unthrottled).
        # Page-worthy after 5m: abuse windows are unprotected while it fires.
        expr: rate(agric_throttle_redis_errors_total[5m]) > 0
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: Rate limiting fail-open — Redis throttler cache down
          action: >-
            Check Redis health (redis dependency on /health/ready shows the
            degraded tier: cache fail-open, idempotency/OTP stores
            fail-closed). While this fires, per-IP rate limits are NOT
            enforced — watch http_requests_total for abuse and restore Redis
            per docs/runbooks/ops.md.

      - alert: AgricIdempotentReplayStorm
        expr: rate(agric_idempotent_replays_total[10m]) > 1
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: Idempotency replay storm — client retry loop
          action: >-
            A client is retrying in a tight loop. Identify the route via the
            http_requests_total by-route panel and contact the integrator.

  - name: agric-money-flows
    rules:
      - alert: AgricVoucherRedemptionFailures
        # SLO: voucher redemptions succeed; a failure storm means farmers
        # cannot redeem inputs or the redemption path is broken.
        expr: rate(agric_voucher_redemptions_total{result="failure"}[15m]) > 0.05
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: Voucher redemption failures climbing
          action: >-
            Break down failures in the API logs (409 double-redeem vs 410
            expired vs 5xx). If 5xx-dominated, check ledger health and the
            stuck-voucher sweeper (POST /admin/sweeps/voucher-stuck) per
            docs/runbooks/ops.md.

      - alert: AgricAgentPayoutFailures
        # SLO: agent cash-out payouts succeed; failures strand farmer cash
        # at agent points.
        expr: rate(agric_agent_payouts_total{result="failure"}[15m]) > 0.05
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: Agent-banking payout failures climbing
          action: >-
            Check OTP verification health (agric_otp_verifications_total),
            agent float balances and ledger posting errors in the API logs;
            verify daily-limit counters before forcing retries.

  - name: agric-backup-deadman
    rules:
      - alert: AgricBackupStale
        # Dead-man switch (docs/runbooks/dr.md): page when no successful
        # backup dump has been observed for over 26 hours (nightly cadence
        # + 2h grace). A silently dead backup cron is otherwise discovered
        # at restore time.
        expr: time() - max(agric_backup_last_success_timestamp_seconds) > 93600
        for: 1h
        labels:
          severity: page
        annotations:
          summary: No successful database backup in over 26h
          action: >-
            Check the backup CronJob and scripts/backup-postgres.sh logs;
            run one manual backup and verify the dump manifest + checksum,
            then confirm agric_backup_last_success_timestamp_seconds is
            being pushed (pushgateway/textfile) per docs/runbooks/dr.md.

      - alert: AgricBackupMetricAbsent
        # Dead-man switch for the dead-man switch: if the freshness metric
        # itself is absent, the stale-backup alert above can never fire.
        expr: absent(agric_backup_last_success_timestamp_seconds)
        for: 1h
        labels:
          severity: warn
        annotations:
          summary: Backup freshness metric missing — dead-man switch blind
          action: >-
            The backup job is not pushing agric_backup_last_success_timestamp_seconds
            (or the pushgateway/textfile scrape is down). Restore the metric
            path first, then verify a recent dump exists per docs/runbooks/dr.md.
