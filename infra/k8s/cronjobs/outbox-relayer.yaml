# Outbox relayer CronJob (WP-G12). NOT part of any kustomization: review and
# apply deliberately once a cluster exists.
#
#   kubectl apply -f infra/k8s/cronjobs/outbox-relayer.yaml
#
# Drives POST /admin/outbox/sweep every minute: retries stalled unpublished
# outbox rows with backoff and dead-letters exhausted rows. Without this job
# (or SWEEPERS_ENABLED on the API) the relay silently stops.
#
# Auth: SWEEPER_ADMIN_TOKEN must be an admin OIDC JWT (provisioned as the
# SWEEPER_ADMIN_TOKEN key of the agric-secrets Secret — see
# infra/k8s/secrets-provisioning.md). Without it the API answers 401 and the
# job FAILS LOUDLY (never a silent skip).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: outbox-relayer
  namespace: agric-platform
spec:
  schedule: "* * * * *" # every minute
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: outbox-relayer
            app.kubernetes.io/part-of: agric-platform
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: trigger
              image: ghcr.io/PLACEHOLDER_ORG/agric-api:0.1.0
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: API_BASE_URL
                  value: "http://api.agric-platform.svc.cluster.local/api/v1"
                - name: SWEEPER_ADMIN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: agric-secrets
                      key: SWEEPER_ADMIN_TOKEN
                      optional: true
              command: ["/bin/sh", "-c"]
              args:
                - wget -q -T 30 -O- --header="Authorization: Bearer ${SWEEPER_ADMIN_TOKEN:-}" --post-data='' "${API_BASE_URL}/admin/outbox/sweep"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
