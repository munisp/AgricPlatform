# GeoLibre web GIS. Image is built by infra/geolibre/Dockerfile (pinned
# upstream tag v2.8.0); the placeholder registry follows the same convention
# as infra/k8s/web.yaml / api.yaml and is rewritten per-overlay by kustomize.
# NOT wired into the base kustomization.yaml — apply explicitly or reference
# from an overlay's resources.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geolibre
  labels:
    app.kubernetes.io/name: geolibre
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: geolibre
  template:
    metadata:
      labels:
        app.kubernetes.io/name: geolibre
    spec:
      containers:
        - name: geolibre
          image: ghcr.io/PLACEHOLDER_ORG/agric-geolibre:2.8.0
          ports:
            - name: http
              containerPort: 8300
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: geolibre
  labels:
    app.kubernetes.io/name: geolibre
spec:
  selector:
    app.kubernetes.io/name: geolibre
  ports:
    - name: http
      port: 8300
      targetPort: http
