# Secret TEMPLATE — contains placeholder keys only, no real values.
# Provisioning rule: never commit populated Secrets. Create real secrets via
# your secret manager (AWS Secrets Manager, External Secrets Operator, sealed
# secrets, or `kubectl create secret`) in each environment.
#
# Example (local cluster):
#   kubectl -n agric-platform create secret generic agric-secrets \
#     --from-literal=DATABASE_URL='postgresql://...' \
#     --from-literal=REDIS_URL='redis://...' ...
apiVersion: v1
kind: Secret
metadata:
  name: agric-secrets
  annotations:
    # Signals to tooling that this manifest is a placeholder.
    agricplatform.io/placeholder: "true"
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_ME"
  REDIS_URL: "REPLACE_ME"
  KEYCLOAK_CLIENT_SECRET: "REPLACE_ME"
  MEILISEARCH_API_KEY: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME"
  WEBHOOK_SIGNING_SECRET: "REPLACE_ME"
  TERMII_API_KEY: "REPLACE_ME"
  WHATSAPP_360DIALOG_API_KEY: "REPLACE_ME"
  MAILGUN_API_KEY: "REPLACE_ME"
  ONESIGNAL_REST_API_KEY: "REPLACE_ME"
  PAYSTACK_SECRET_KEY: "REPLACE_ME"
  MOODLE_TOKEN: "REPLACE_ME"
  DISCOURSE_API_KEY: "REPLACE_ME"
  DIRECTUS_TOKEN: "REPLACE_ME"
