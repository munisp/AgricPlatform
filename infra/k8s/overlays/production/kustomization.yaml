# Production overlay — full replica envelope, hardened container security
# contexts, production hosts. Applied only after manual approval on the
# `production` GitHub Environment; the deploy workflow pins the exact image
# tag via `kustomize edit set image` before applying.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The base is referenced as the `../../base` directory (not `- ../../`):
# the overlays live INSIDE the infra/k8s root, and kustomize refuses a
# kustomization whose resource root contains the kustomization itself
# ("cycle detected", kustomize v4 and v5 alike — `- ../../` never rendered).
# namespace/commonLabels are repeated here (not only in base/) because a
# kustomization's own transforms apply to its own resources too — the
# overlay-only manifests (HPA/PDB/NetworkPolicy, CronJobs) would otherwise
# render without them.
namespace: agric-platform

commonLabels:
  app.kubernetes.io/part-of: agric-platform

resources:
  - ../../base
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  # GAP-M03 backstop schedulers: the outbox sweep and webhook
  # reprocess/redrive CronJobs (see infra/k8s/cronjobs/kustomization.yaml —
  # only the default-on backstops are resources there). They are BACKSTOPS
  # to the in-process schedulers (SWEEPERS_ENABLED on the API, off by
  # default) and are safe to run concurrently with them — every sweep
  # endpoint is idempotent and CAS-guarded, so an overlapping pass is a
  # no-op. See docs/runbooks/ops.md ("Backstop scheduler CronJobs").
  - ../../cronjobs

images:
  - name: ghcr.io/PLACEHOLDER_ORG/agric-web
    newTag: "production"
  - name: ghcr.io/PLACEHOLDER_ORG/agric-api
    newTag: "production"

replicas:
  - name: web
    count: 2
  - name: api
    count: 3

patches:
  - path: patch-config.yaml
  - path: patch-resources.yaml
  - path: patch-security-context.yaml
