# Production overlay — full replica envelope, hardened container security
# contexts, production hosts. Applied only after manual approval on the
# `production` GitHub Environment; the deploy workflow pins the exact image
# tag via `kustomize edit set image` before applying.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml

images:
  - name: ghcr.io/PLACEHOLDER_ORG/agric-web
    newTag: "production"
  - name: ghcr.io/PLACEHOLDER_ORG/agric-api
    newTag: "production"

replicas:
  - name: web
    count: 2
  - name: api
    count: 3

patches:
  - path: patch-config.yaml
  - path: patch-resources.yaml
  - path: patch-security-context.yaml
