# Staging overlay — mirrors production topology at reduced scale with sandbox
# provider drivers. The deploy workflow pins the exact image tag via
# `kustomize edit set image` before applying; the tags below are placeholders.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml

images:
  - name: ghcr.io/PLACEHOLDER_ORG/agric-web
    newTag: "staging"
  - name: ghcr.io/PLACEHOLDER_ORG/agric-api
    newTag: "staging"

replicas:
  - name: web
    count: 1
  - name: api
    count: 1

patches:
  - path: patch-config.yaml
