# APISIX declarative routes (wave FABRIC, LOCAL DEV ONLY).
# Standalone mode (config_provider: yaml — see config.yaml in this folder).
# Routes the gateway to the api and web services of the compose stack.
# The key-auth credential below is a DOCUMENTED PLACEHOLDER — rotate before
# any non-local use. The limit-count plugin mirrors the app-level throttler
# (apps/api ThrottlerModule: 120 req/min default) so abusive clients are
# shed at the edge before they reach the API.
routes:
  - id: agric-api-v1
    uri: /api/*
    name: agric-api
    upstream:
      type: roundrobin
      nodes:
        "api:3001": 1
    plugins:
      # Edge rate limit mirroring the app throttler (120 requests/min/IP).
      limit-count:
        count: 120
        time_window: 60
        rejected_code: 429
        key: remote_addr
      # Placeholder key-auth for machine consumers of the gateway. The app
      # keeps its own OIDC/RBAC — this key only gates gateway passage.
      key-auth: {}
      # Distributed tracing at the edge (stage 25). Spans are exported over
      # OTLP/HTTP to the platform hub collector (otel-collector:4318, config
      # in infra/observability/otel-collector-config.yaml) and forwarded to
      # SigNoz. sampler.fraction 1.0 is for local dev — drop it (e.g. 0.1)
      # in production.
      opentelemetry:
        sampler:
          name: trace_id_ratio
          options:
            fraction: 1.0
        collector:
          address: otel-collector:4318
          request_timeout: 3
        batch_span_processor:
          drop_on_queue_full: true
          max_queue_size: 1024
          batch_timeout: 2
          inactive_timeout: 1
          max_export_batch_size: 16
        # Resource attributes stamped on every gateway span. tenant.id is a
        # STATIC placeholder here: APISIX (standalone yaml mode) has no
        # per-request tenant resolution. The authoritative tenant.id is
        # stamped in-app by the TenantAttributionInterceptor (stage 25.1);
        # a custom APISIX plugin can overwrite this per request from a
        # header/claim later without touching the collector.
        resource_attributes:
          service.name: agric-apisix
          deployment.environment: local-dev
          tenant.id: unknown
      # Prometheus metrics for the gateway (scraped by the hub collector,
      # job `apisix` -> apisix:9091/apisix/prometheus/metrics).
      prometheus: {}
  - id: agric-web
    uri: /*
    name: agric-web
    upstream:
      type: roundrobin
      nodes:
        "web:3000": 1
consumers:
  # LOCAL DEV PLACEHOLDER consumer key — never reuse outside local dev.
  - username: partner-local
    plugins:
      key-auth:
        key: local-dev-partner-key
#END
