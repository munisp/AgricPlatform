name: Bug report
description: Report a defect in AgricPlatform
title: "fix(<scope>): "
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please include enough detail to reproduce.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One-line description of the defect.
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      options:
        - identity
        - profiles
        - learning
        - community
        - opportunities
        - chapters
        - advisory
        - marketplace
        - finance
        - notifications
        - admin
        - analytics
        - privacy
        - search
        - integrations
        - infra
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include logs, screenshots, or API responses. Redact personal data and secrets.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: local / dev / staging / production
  - type: checkboxes
    id: gates
    attributes:
      label: Potential release gates affected
      options:
        - label: NDPR/privacy
        - label: Security
        - label: Payments
        - label: Connectivity/offline
