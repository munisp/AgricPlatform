version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Lagos
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels:
      - "type: chore"
      - "domain: infra"
    groups:
      typescript-tooling:
        patterns:
          - "typescript"
          - "@types/*"
          - "vitest"
      next:
        patterns:
          - "next"
          - "react"
          - "react-dom"
      nest:
        patterns:
          - "@nestjs/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "type: chore"
      - "domain: infra"

  - package-ecosystem: docker
    directory: "/infra/docker"
    schedule:
      interval: weekly
    labels:
      - "type: chore"
      - "domain: infra"

  - package-ecosystem: docker-compose
    directory: "/infra"
    schedule:
      interval: weekly
    labels:
      - "type: chore"
      - "domain: infra"
